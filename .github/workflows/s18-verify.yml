name: s18-verify

on:
  push:
    branches:
      - "s18ci/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - name: Which tree ran
        run: git log -3 --format='%H %T %s'
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_dev.txt
          pip install -e .
          pip install plugins/sqlfluff-plugin-example
      - name: New fixtures (mysql and mariadb match_against)
        run: pytest test/dialects/dialects_test.py -k "match_against" -v -p no:cacheprovider
      - name: Full test suite
        run: |
          python util.py clean-tests
          pytest test -n auto -rsfE -p no:cacheprovider
      - name: Lint and type check
        if: matrix.python-version == '3.13'
        run: |
          ruff check .
          ruff format --check .
          lint-imports
          yamllint -c .yamllint .
          mypy -p sqlfluff
          mypy -p sqlfluff.core --strict
